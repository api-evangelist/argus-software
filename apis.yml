name: Argus Software
description: >-
  Argus Software (ARGUS) is a commercial real estate software provider whose
  products are the industry standard for cash-flow modeling, valuation, asset
  and investment management, and development-project appraisal for owners,
  investors, lenders, and advisors. Founded in Houston, Texas and acquired by
  Altus Group in 2011, the ARGUS product line is now delivered through Altus
  Group as the ARGUS Intelligence platform and includes ARGUS Enterprise, ARGUS
  EstateMaster, ARGUS Developer, ARGUS Taliance, ARGUS ValueInsight, ARGUS
  Voyanta, and Forbury. ARGUS software is used across the global commercial real
  estate industry to underwrite acquisitions, perform discounted cash-flow
  analysis, run portfolio and fund analytics, and standardize valuations. As of
  this enrichment pass ARGUS exposes no public developer portal, OpenAPI
  description, or self-service API program; its cloud platform is accessed
  through the Altus Platform / ARGUS Cloud portal.
